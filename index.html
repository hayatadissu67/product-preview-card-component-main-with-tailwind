<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=League+Spartan:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body class="bg-[hsl(30_38%_92%)] flex flex-col items-center justify-center min-h-screen font-[Montserrat]">
  <div class="flex flex-col md:flex-row w-[600px] mx-auto  bg-white rounded-lg">
    <div class="md:w-1/2 overflow-hidden rounded-t-lg md:rounded-l-lg md:rounded-tr-none">
      <img src="./images/image-product-desktop.jpg" alt="Product Image" class=" w-full h-full object-cover md:hidden rounded-l-lg">
      <img src="./images/image-product-mobile.jpg" alt="Product Image" class="w-full h-full object-cover hidden md:block">
    </div>
    <div class="px-6 py-10px md:w-1/2 flex flex-col justify-center p-6">
      <h2 class="text-sm text-gray-500 tracking-[6px] uppercase ">Perfume</h2>
      <h1 class="text-4xl font-bold mt-2 mb-4 font-[Fraunces]">Gabrielle Essence Eau De Parfum</h1>
      <p class="text-gray-700 mb-6">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
        Perfumer-Creator for the House of CHANEL.</p>
      <div class="flex items-center mb-6">
        <span class="text-3xl font-bold text-[hsl(158_36%_37%)] mr-4 ">$149.99</span>
        <span class="text-gray-500 line-through">$169.99</span>
      </div>
      <button  class="bg-[hsl(158_36%_37%)] text-white py-3 px-6 rounded-lg hover:bg-green-800 transition duration-300"> 
        <img src="./images/icon-cart.svg" alt="Cart Icon" class="inline-block mr-2">
        Add to Cart</button>
    
    </div>
  </div>
  <footer class="attribution mt-6">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Hayat</a>.
  </footer>
</body>
</html>
